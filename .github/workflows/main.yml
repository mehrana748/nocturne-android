name: NOCTURNE Android APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "design/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NOCTURNE-0.1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-android-debug-apk
          path: app/build/outputs/apk/debug/NOCTURNE-0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 14
